[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "humantype"
version = "0.1.0"
description = "Replay copied text as human-like keystrokes into any focused window."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# The keyboard backend and clipboard reader. Optional so the planner, the
# tests, and --dry-run all work on a headless machine with nothing installed.
keyboard = ["pynput>=1.7", "pyperclip>=1.8"]

[project.scripts]
humantype = "humantype.cli:main"

[tool.setuptools.packages.find]
include = ["humantype*"]
